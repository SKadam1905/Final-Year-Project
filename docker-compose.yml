# Needs Docker Desktop (WSL 2) on Windows.
#
#   docker compose up -d                         # Redis, MediaMTX demo cameras
#   docker compose --profile app up -d --build   # ...plus the backend in a container (CPU only)
#   docker compose ps                            # redis should be "healthy"
#
# The database is MongoDB Atlas (cloud): set MONGODB_URI in .env; there is no database container.
#
# For GPU inference run the backend natively instead (see README). The React dashboard runs
# with `npm run dev` in frontend/ (see README).
services:
  redis:
    image: redis:7.2-alpine
    command: redis-server --save "" --appendonly no   # frames are transient: no persistence
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Serves data/india_dataset/raw_videos/<name>.mp4 at rtsp://localhost:8554/<name>
  # (HLS preview in a browser: http://localhost:8888/<name>)
  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    ports:
      - "8554:8554"
      - "8888:8888"
    volumes:
      - ./mediamtx.yml:/mediamtx.yml:ro
      - ./data/india_dataset/raw_videos:/videos:ro

  backend:
    profiles: ["app"]
    build: ./backend
    env_file: .env
    environment:
      REDIS_URL: redis://redis:6379/0
      FRAME_SOURCE: redis   # frames come from `python -m app.camera_manager` on the host
      DEVICE: cpu
    ports:
      - "8000:8000"
    volumes:
      - ./config:/repo/config:ro
      - ./backend/ml/weights:/repo/backend/ml/weights:ro
    depends_on:
      redis:
        condition: service_healthy
