# Database migrations (PostgreSQL 16 + PostGIS 3.4). Run from backend\ with the venv active:
#   alembic upgrade head          create or upgrade the schema in DATABASE_URL (.env)
#   alembic upgrade head --sql    print the SQL without connecting to a database
#   alembic downgrade base        drop everything this project created
# The URL comes from app.config (DATABASE_URL), not from this file.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
